<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Taskmate</title>
</head>
<body class="font-[Arial,sans-serif] text-[#172b4d] bg-[#f8f8fc]">
    <!-- HEADER -->
    <header class="h-[75px] bg-white flex justify-between items-center px-[7%]">
      <div class="flex justify-center items-center">
        <img src="images/pagelines-brands-solid-full.svg" alt="" class="w-[30px] h-[40px]" />
        <h2 class="text-2xl font-bold text-[#877bf4]">TaskMate</h2>
      </div>

      <nav class="flex items-center gap-[25px] text-[15px]">
        <a href="index.html" class="max-[600px]:hidden hover:bg-[#ca5aef] hover:text-white hover:px-4 hover:py-3 hover:rounded-[10px]">Home</a>
        <a href="dashboard.html" class="bg-[#ca5aef] text-white px-[22px] py-3 rounded-[10px]">Dashboard</a>
      </nav>
    </header>

    <!-- HERO -->
    <section class="min-h-[500px] px-[7%] py-[60px] grid grid-cols-1 md:grid-cols-2 items-center gap-10 bg-[#f0edff]">
      <div>
        <h1 class="text-[42px] sm:text-[55px] font-bold">Small Steps</h1>
        <h1 class="text-[42px] sm:text-[55px] font-bold text-[#6045d8]">Big Goals</h1>

        <p class="max-w-[500px] mt-[25px] mb-[30px] text-[17px] leading-[1.7]">
          TaskMate helps you organize your tasks,
          stay focused and reach your goals one step at a time.
        </p>

        <a href="dashboard.html" class="bg-[#ca5aef] text-white px-[22px] py-3 rounded-[10px]">Get Started</a>
      </div>

      <div class="flex justify-center items-center relative">
        <div class="text-[100px]">
          <img src="images/THE GLOBAL TECHNOLOGY_.jpeg" alt="" class="w-[300px] h-[350px] rounded-[10px] mt-[30px]" />
        </div>
      </div>
    </section>

</html>
